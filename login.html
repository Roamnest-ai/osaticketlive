<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSA Control Center - Login</title>

<style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; } body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f5; } /* LOGIN BOX */ .login-box { width: 390px; background: white; padding: 40px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.10); } /* LOGO */ .logo { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 6px; } .logo span { color: #e60023; } .tagline { text-align: center; color: #999; font-size: 10px; letter-spacing: 1.5px; margin-bottom: 35px; } .login-title { font-size: 20px; margin-bottom: 7px; } .login-description { color: #777; font-size: 13px; margin-bottom: 25px; } /* FORM */ .form-group { margin-bottom: 18px; } .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 7px; } .form-group input { width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 7px; outline: none; font-size: 14px; } .form-group input:focus { border-color: #e60023; } /* LOGIN BUTTON */ .login-button { width: 100%; padding: 13px; border: none; border-radius: 7px; background: #e60023; color: white; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; } .login-button:hover { background: #c90020; } /* ERROR */ .error { display: none; background: #ffe5e8; color: #c00020; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; text-align: center; } /* FOOTER */ .footer { text-align: center; color: #aaa; font-size: 11px; margin-top: 25px; } </style>

</head>

<body>

<div class="login-box">

<div class="logo">

    <span>OSA</span> CONTROL CENTER

</div>


<div class="tagline">

    YOUR ACCESS. REAL TIME.

</div>


<div class="login-title">

    Administrator Login

</div>


<div class="login-description">

    Sign in to manage OSA Ticket Live.

</div>


<div
    class="error"
    id="errorMessage">

    Incorrect username or password.

</div>


<div class="form-group">

    <label>
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Enter username">

</div>


<div class="form-group">

    <label>
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter password">

</div>


<button
    class="login-button"
    onclick="login()">

    LOGIN

</button>


<div class="footer">

    OSA Ticket Live © 2026

</div>

</div>




<script> function login() { const username = document.getElementById("username").value; const password = document.getElementById("password").value; /* TEMPORARY PROTOTYPE LOGIN We will replace this with proper server authentication later. */ const correctUsername = "admin"; const correctPassword = "OSA123"; if ( username === correctUsername && password === correctPassword ) { sessionStorage.setItem( "osaAdminLoggedIn", "true" ); window.location.href = "admin.html"; } else { document.getElementById( "errorMessage" ).style.display = "block"; } } </script>

</body>

</html>
